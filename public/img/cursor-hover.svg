<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd1ea"/><stop offset=".55" stop-color="#ff5fb0"/><stop offset="1" stop-color="#c21f7a"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c2ff"/><stop offset=".35" stop-color="#ff8cc6"/><stop offset=".7" stop-color="#ffa36b"/><stop offset="1" stop-color="#b38cff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- soft depth / shadow -->
  <path d="M9 7 L11 53 L23 42 L31 59 L40 55 L32 38 L48 37 Z" fill="#3a1080" opacity=".35" stroke="#3a1080" stroke-opacity=".35" stroke-width="5" stroke-linejoin="round"/>
