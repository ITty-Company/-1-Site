  <path d="M6 4 L8 50 L20 39 L28 56 L37 52 L29 35 L45 34 Z" fill="url(#rim)" stroke="#b0186a" stroke-width="2" stroke-linejoin="round"/>
  <!-- inner gradient core -->
  <path d="M11 13 L12.5 42 L21 34.5 L29.5 51 L32 50 L23.5 33 L35 32.5 Z" fill="url(#core)" opacity=".95" stroke-linejoin="round"/>
  <!-- glass highlights -->
  <path d="M7.5 7 L9 44" stroke="url(#shine)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M10 8 L40 33" stroke="#fff" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="13" cy="18" r="2.2" fill="#fff" opacity=".8"/>
</svg>
